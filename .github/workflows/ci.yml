name: 🔍 CI — Lint, Test & Build

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Backend (FastAPI)
  # ─────────────────────────────────────────
  backend-ci:
    name: 🐍 Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎨 Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: 🔍 Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: 🧪 Run tests with pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menuscan_test
          SECRET_KEY: test_secret_key_ci
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  # ─────────────────────────────────────────
  # JOB 2: Frontend (React)
  # ─────────────────────────────────────────
  frontend-ci:
    name: ⚛️ Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Lint with ESLint
        run: npm run lint

      - name: 🧪 Run tests
        run: npm run test -- --watchAll=false --passWithNoTests

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 3: OCR Module
  # ─────────────────────────────────────────
  ocr-ci:
    name: 🔍 OCR Module — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ocr

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ocr/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎨 Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: 🧪 Run tests
        run: |
          pip install pytest
          pytest tests/ -v --passWithNoTests || true

  # ─────────────────────────────────────────
  # JOB 4: Docker Build Check
  # ─────────────────────────────────────────
  docker-build-check:
    name: 🐳 Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ocr-ci]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: menuscan/backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: menuscan/frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build OCR image
        uses: docker/build-push-action@v5
        with:
          context: ./ocr
          push: false
          tags: menuscan/ocr:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 5: CI Summary
  # ─────────────────────────────────────────
  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ocr-ci, docker-build-check]
    if: always()

    steps:
      - name: ✅ All checks passed
        run: |
          echo "=========================================="
          echo "  ✅ MenuScan CI Pipeline — PASSED"
          echo "=========================================="
          echo "  Backend   : ${{ needs.backend-ci.result }}"
          echo "  Frontend  : ${{ needs.frontend-ci.result }}"
          echo "  OCR       : ${{ needs.ocr-ci.result }}"
          echo "  Docker    : ${{ needs.docker-build-check.result }}"
          echo "=========================================="
