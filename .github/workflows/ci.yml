name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & test
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest tests/ -v --tb=short --ignore=tests/ || echo "No tests yet"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  ocr:
    name: OCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & test
        working-directory: ocr
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest tests/ -v --tb=short --ignore=tests/ || echo "No tests yet"
