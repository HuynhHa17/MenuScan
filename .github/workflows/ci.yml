# ============================================================
# CI — Kiểm tra code tự động
# Chạy khi: tạo Pull Request hoặc push vào nhánh dev / main
# ============================================================

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:

  # ──────────────────────────────────────
  # 1. Kiểm tra Backend (Python / FastAPI)
  # ──────────────────────────────────────
  backend:
    name: Backend — Test
    runs-on: ubuntu-latest

    services:
      # Chạy PostgreSQL tạm thời để test
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: menuscan
          POSTGRES_PASSWORD: menuscan
          POSTGRES_DB: menuscan_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài đặt thư viện
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Chạy tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://menuscan:menuscan@localhost:5432/menuscan_test
          SECRET_KEY: ci-secret-key
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short

  # ──────────────────────────────────────
  # 2. Kiểm tra Frontend (React)
  # ──────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt thư viện
        working-directory: frontend
        run: npm ci

      - name: Chạy tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build thử production
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────
  # 3. Kiểm tra OCR Module (Python)
  # ──────────────────────────────────────
  ocr:
    name: OCR — Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ocr/requirements.txt

      - name: Cài đặt thư viện
        working-directory: ocr
        run: pip install -r requirements.txt

      - name: Chạy tests
        working-directory: ocr
        run: |
          pip install pytest
          pytest tests/ -v --tb=short
