name: 🚀 CD — Deploy to Staging

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/menuscan

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker Images
  # ─────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images to Registry
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:staging,${{ env.IMAGE_PREFIX }}/backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:staging,${{ env.IMAGE_PREFIX }}/frontend:staging-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push OCR
        uses: docker/build-push-action@v5
        with:
          context: ./ocr
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ocr:staging,${{ env.IMAGE_PREFIX }}/ocr:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Staging Server
  # ─────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SERVER_PORT || 22 }}
          script: |
            set -e
            echo "📦 Pulling latest images..."
            cd /opt/menuscan-staging

            # Update image tags in compose
            export IMAGE_TAG=staging-${{ github.sha }}
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            # Pull new images
            docker compose -f docker-compose.staging.yml pull

            # Rolling restart (zero downtime)
            docker compose -f docker-compose.staging.yml up -d --no-deps --remove-orphans

            # Run database migrations
            docker compose -f docker-compose.staging.yml exec -T backend alembic upgrade head

            # Health check
            sleep 10
            curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1

            echo "✅ Staging deployment successful!"

      - name: 🧹 Clean up old images on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: docker image prune -f

  # ─────────────────────────────────────────
  # JOB 3: Smoke Test Staging
  # ─────────────────────────────────────────
  smoke-test-staging:
    name: 💨 Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: ⏳ Wait for deployment to stabilize
        run: sleep 15

      - name: 🔍 Health check — API
        run: |
          curl -f ${{ secrets.STAGING_URL }}/api/health \
            -H "Accept: application/json" \
            --retry 5 --retry-delay 5

      - name: 🔍 Health check — Frontend
        run: |
          curl -f ${{ secrets.STAGING_URL }} \
            --retry 3 --retry-delay 5

      - name: ✅ Staging smoke tests passed
        run: echo "✅ All smoke tests passed on staging!"

  # ─────────────────────────────────────────
  # JOB 4: Notify Result
  # ─────────────────────────────────────────
  notify:
    name: 🔔 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, smoke-test-staging]
    if: always()

    steps:
      - name: 📣 Notify success
        if: ${{ needs.deploy-staging.result == 'success' }}
        run: |
          echo "🎉 Staging deployment SUCCEEDED!"
          echo "Branch : dev"
          echo "Commit : ${{ github.sha }}"
          echo "URL    : ${{ secrets.STAGING_URL }}"
          # Có thể thêm webhook Slack/Discord/Telegram ở đây

      - name: 📣 Notify failure
        if: ${{ needs.deploy-staging.result == 'failure' }}
        run: |
          echo "❌ Staging deployment FAILED!"
          echo "Branch : dev"
          echo "Commit : ${{ github.sha }}"
          # Có thể thêm webhook Slack/Discord/Telegram ở đây
