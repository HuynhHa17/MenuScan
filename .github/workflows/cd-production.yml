name: 🏭 CD — Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke_test:
        description: "Skip smoke tests?"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/menuscan

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Pre-flight checks
  # ─────────────────────────────────────────
  preflight:
    name: ✈️ Pre-flight Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Verify required secrets exist
        run: |
          if [ -z "${{ secrets.PROD_SERVER_HOST }}" ]; then
            echo "❌ PROD_SERVER_HOST secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_SSH_PRIVATE_KEY }}" ]; then
            echo "❌ PROD_SSH_PRIVATE_KEY secret is missing!"
            exit 1
          fi
          echo "✅ All required secrets are present."

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Production Images
  # ─────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Production Images
    runs-on: ubuntu-latest
    needs: preflight

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:prod-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:prod-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push OCR
        uses: docker/build-push-action@v5
        with:
          context: ./ocr
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ocr:latest
            ${{ env.IMAGE_PREFIX }}/ocr:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: Database Migration
  # ─────────────────────────────────────────
  db-migration:
    name: 🗃️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production

    steps:
      - name: 🗃️ Run Alembic migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/menuscan-prod

            echo "📦 Pulling latest backend image..."
            docker compose -f docker-compose.prod.yml pull backend

            echo "🗃️ Running migrations..."
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

            echo "✅ Migrations completed successfully!"

  # ─────────────────────────────────────────
  # JOB 4: Deploy to Production (Blue-Green)
  # ─────────────────────────────────────────
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: db-migration
    environment:
      name: production
      url: ${{ secrets.PROD_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/menuscan-prod

            export IMAGE_TAG=prod-${{ github.sha }}
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            echo "📦 Pulling all latest production images..."
            docker compose -f docker-compose.prod.yml pull

            echo "♻️ Restarting services with zero downtime..."
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans \
              --scale backend=2

            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            # Health check
            curl -f http://localhost/api/health || (
              echo "❌ Health check failed, rolling back..."
              docker compose -f docker-compose.prod.yml rollback
              exit 1
            )

            # Scale back to normal
            docker compose -f docker-compose.prod.yml up -d --scale backend=1

            echo "✅ Production deployment successful!"
            echo "   Version: ${{ github.sha }}"

      - name: 🧹 Clean up old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: docker image prune -f

  # ─────────────────────────────────────────
  # JOB 5: Production Smoke Tests
  # ─────────────────────────────────────────
  smoke-test-production:
    name: 💨 Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: ${{ github.event.inputs.skip_smoke_test != 'true' }}

    steps:
      - name: ⏳ Wait for deployment to stabilize
        run: sleep 20

      - name: 🔍 API Health Check
        run: |
          curl -f "${{ secrets.PROD_URL }}/api/health" \
            -H "Accept: application/json" \
            --retry 5 --retry-delay 10

      - name: 🔍 Frontend Accessibility Check
        run: |
          curl -f "${{ secrets.PROD_URL }}" \
            --retry 3 --retry-delay 5

      - name: 🔍 OCR Endpoint Check
        run: |
          curl -f "${{ secrets.PROD_URL }}/api/v1/ocr/health" \
            --retry 3 --retry-delay 5

      - name: ✅ All production smoke tests passed
        run: echo "🎉 Production is healthy!"

  # ─────────────────────────────────────────
  # JOB 6: Create GitHub Release
  # ─────────────────────────────────────────
  create-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: smoke-test-production
    if: success()

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline -20)
          else
            COMMITS=$(git log $PREV_TAG..HEAD --oneline)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: "🚀 Release #${{ github.run_number }}"
          body: |
            ## 🍽️ MenuScan — Production Release

            **Commit:** `${{ github.sha }}`
            **Branch:** `main`
            **Deployed:** ${{ github.event.head_commit.timestamp }}

            ### 📝 Changes
            ```
            ${{ steps.release_notes.outputs.commits }}
            ```

            ### 🐳 Docker Images
            - `ghcr.io/${{ github.repository_owner }}/menuscan/backend:prod-${{ github.sha }}`
            - `ghcr.io/${{ github.repository_owner }}/menuscan/frontend:prod-${{ github.sha }}`
            - `ghcr.io/${{ github.repository_owner }}/menuscan/ocr:prod-${{ github.sha }}`
          draft: false
          prerelease: false

  # ─────────────────────────────────────────
  # JOB 7: Notify Result
  # ─────────────────────────────────────────
  notify:
    name: 🔔 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-test-production, create-release]
    if: always()

    steps:
      - name: 🎉 Notify success
        if: ${{ needs.deploy-production.result == 'success' }}
        run: |
          echo "============================================"
          echo "  🎉 PRODUCTION DEPLOYMENT SUCCEEDED!"
          echo "============================================"
          echo "  URL    : ${{ secrets.PROD_URL }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Run    : #${{ github.run_number }}"
          echo "============================================"
          # Thêm Slack / Discord / Telegram webhook ở đây

      - name: ❌ Notify failure
        if: ${{ needs.deploy-production.result == 'failure' }}
        run: |
          echo "============================================"
          echo "  ❌ PRODUCTION DEPLOYMENT FAILED!"
          echo "============================================"
          echo "  Commit : ${{ github.sha }}"
          echo "  Please check the logs and rollback if needed."
          echo "============================================"
          # Thêm Slack / Discord / Telegram webhook ở đây
