name: 🛡️ Security & Code Quality

on:
  schedule:
    - cron: "0 2 * * 1" # Mỗi thứ Hai lúc 2AM
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Dependency Security Scan
  # ─────────────────────────────────────────
  security-scan:
    name: 🔒 Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Scan Python dependencies (Safety)
        run: |
          pip install safety
          safety check -r backend/requirements.txt --output text || true
          safety check -r ocr/requirements.txt --output text || true

      - name: 🔍 Scan Node.js dependencies (npm audit)
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=high || true

  # ─────────────────────────────────────────
  # JOB 2: Docker Image Vulnerability Scan
  # ─────────────────────────────────────────
  trivy-scan:
    name: 🛡️ Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Backend image for scanning
        run: docker build -t menuscan/backend:scan ./backend

      - name: 🔍 Scan Backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "menuscan/backend:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────
  # JOB 3: Code Quality (SonarCloud - optional)
  # ─────────────────────────────────────────
  code-quality:
    name: 📊 Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📊 Run coverage report
        working-directory: ./backend
        run: |
          pip install -r requirements.txt pytest pytest-cov
          pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing || true

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: menuscan-backend
        continue-on-error: true
